name: exp011_hopper_surrogates
description: >
  Hopper-v5 の連続行動設定で4種類 surrogate（RegTree / RegEBM / RegSDT / RegSymbolic）
  を単発実行。binning を使わず、AA は epsilon-agreement で評価。

hopper:
  n_steps: 50000
  oracle_model_path: experiments/results/rlzoo_models/td3/Hopper-v3_1/Hopper-v3.zip
  oracle_algo: td3
  dynamics_conditions:
    - {name: train,      gravity: -9.81}
    - {name: gravity_lo, gravity: -5.0}
    - {name: gravity_hi, gravity: -20.0}
    - {name: friction_lo, gravity: -9.81, friction_scale: 0.7}
    - {name: friction_hi, gravity: -9.81, friction_scale: 1.3}
  regression_mode: true
  aa_epsilon: 0.2

comparison:
  model_types: [reg_tree, reg_ebm, reg_sdt, reg_symbolic]
  distill_n_samples: 10000
  eval_n_samples: 3000
  distill_epochs: 200
  reg_tree:
    max_depth: 12
  reg_ebm:
    max_rounds: 300
    outer_bags: 8
    interactions: 0
  reg_sdt:
    depth: 5
    epochs: 120
    lr: 0.001
    batch_size: 512
    l2_leaf_coef: 0.0001
    seed: 42
  reg_symbolic:
    population_size: 1000
    generations: 20
    tournament_size: 20
    parsimony_coefficient: 0.001
    random_state: 42

evaluation:
  seeds: [42, 123, 456, 789, 1011, 2024, 3141, 2718, 6553, 9001]
  n_eval_episodes: 5

output_dir: experiments/results/exp011_hopper_surrogates
