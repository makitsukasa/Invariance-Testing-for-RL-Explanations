name: exp007_lunarlander
description: >
  実験7: LunarLander-v3 連続力学環境への枠組み拡張
  離散行動（4択エンジン制御）・連続物理（重力シフト）
  DQN 1M steps で学習、重力条件変化で分布シフト評価

lunar:
  n_steps: 1000000
  gravity_conditions:
    - {name: train,      gravity: -10.0}
    - {name: gravity_lo, gravity: -3.0}   # 月面相当
    - {name: gravity_hi, gravity: -11.5}  # 強重力（LunarLander は -12〜0 の制約）

comparison:
  model_types: [moet, linear, tree]
  moet:
    n_experts: 4
    max_depth: 5
  tree:
    max_depth: 5
  distill_epochs: 100
  distill_n_samples: 10000
  eval_n_samples: 5000

evaluation:
  seeds: [42, 123, 456, 789, 1011]
  n_eval_episodes: 20

output_dir: experiments/results/exp007_lunarlander
