name: exp003_cartpole_gravity
description: >
  CartPole N=0（スプリアスなし）に対して複数種類の物理パラメータシフトを加え、
  「再現性高×不変性高」が重力シフト限定の偶然でないことを示す実験。

env:
  base: CartPole-v1
  noise_dims: [0]
  # 各条件: gravity と pole_length を指定
  # デフォルト: gravity=9.8, pole_length=0.5
  shift_conditions:
    train:       {gravity: 9.8,  pole_length: 0.5}
    gravity_lo:  {gravity: 5.0,  pole_length: 0.5}
    gravity_hi:  {gravity: 20.0, pole_length: 0.5}
    pole_short:  {gravity: 9.8,  pole_length: 0.25}
    pole_long:   {gravity: 9.8,  pole_length: 1.0}

intuitive:
  algorithm: DQN
  n_steps: 100000
  reuse_from: experiments/results/exp001_cartpole_noise

moet:
  gating: soft
  expert_counts: [4]
  tree_depths: [5]
  distill_epochs: 100
  distill_n_samples: 10000
  eval_n_samples: 5000

evaluation:
  n_eval_episodes: 50
  seeds: [42, 123, 456, 789, 1011, 1314, 1617, 1920, 2223, 2526]

output_dir: experiments/results/exp003_cartpole_gravity
