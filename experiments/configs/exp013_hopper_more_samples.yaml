name: exp013_hopper_more_samples
description: >
  distill_n_samples を 10,000 → 100,000 に増やした場合の効果を検証。
  exp011 (10,000 サンプル) との対照実験。RegTree d=12 のみ、seed=42 単発。

hopper:
  n_steps: 50000
  oracle_model_path: experiments/results/rlzoo_models/td3/Hopper-v3_1/Hopper-v3.zip
  oracle_algo: td3
  dynamics_conditions:
    - {name: train,      gravity: -9.81}
    - {name: gravity_lo, gravity: -5.0}
    - {name: gravity_hi, gravity: -20.0}
    - {name: friction_lo, gravity: -9.81, friction_scale: 0.7}
    - {name: friction_hi, gravity: -9.81, friction_scale: 1.3}
  regression_mode: true
  aa_epsilon: 0.2

comparison:
  model_types: [reg_tree]
  distill_n_samples: 100000
  eval_n_samples: 3000
  distill_epochs: 200
  reg_tree:
    max_depth: 12

evaluation:
  seeds: [42]
  n_eval_episodes: 5

output_dir: experiments/results/exp013_hopper_more_samples
