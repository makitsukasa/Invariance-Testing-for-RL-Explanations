name: exp009_gbt_continuous
description: >
  実験7: LunarLander-v3 への枠組み拡張
  - 学習済み PPO oracle (exp007_lunarlander_ppo) を再利用
  - surrogate: GBT (HistGradientBoostingClassifier) を主とし、MoET・Tree・Linear と比較
  - 重力係数シフト下の per-condition AA と J を評価

lunar:
  algorithm: ppo
  n_envs: 8
  n_steps: 1000000  # 既存モデルがある場合は学習しない
  oracle_model_dir: experiments/results/exp007_lunarlander_ppo
  gravity_conditions:
    - {name: train,      gravity: -10.0}
    - {name: gravity_lo, gravity: -3.0}
    - {name: gravity_hi, gravity: -11.5}

comparison:
  model_types: [gbt, moet, tree, linear]
  gbt:
    max_iter: 300
    max_depth: null
    learning_rate: 0.1
  moet:
    n_experts: 4
    max_depth: 5
  tree:
    max_depth: 5
  distill_epochs: 100
  distill_n_samples: 10000
  eval_n_samples: 5000

evaluation:
  seeds: [42, 123, 456, 789, 1011, 1314, 1617, 1920, 2223, 2526]
  n_eval_episodes: 20

output_dir: experiments/results/exp009_gbt_continuous
