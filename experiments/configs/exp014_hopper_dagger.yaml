name: exp014_hopper_dagger
description: >
  DAgger (Dataset Aggregation) による Hopper 蒸留実験。
  BC の covariate shift 問題を iterative に修正する。
  初期 10,000 サンプル + 10 イテレーション × 10,000 サンプル = 110,000 サンプル相当。
  exp011 (BC 10k) / exp013 (BC 100k) との対照実験。RegTree d=12, seed=42 単発。

hopper:
  n_steps: 50000
  oracle_model_path: experiments/results/rlzoo_models/td3/Hopper-v3_1/Hopper-v3.zip
  oracle_algo: td3
  dynamics_conditions:
    - {name: train,      gravity: -9.81}
    - {name: gravity_lo, gravity: -5.0}
    - {name: gravity_hi, gravity: -20.0}
    - {name: friction_lo, gravity: -9.81, friction_scale: 0.7}
    - {name: friction_hi, gravity: -9.81, friction_scale: 1.3}
  regression_mode: true
  dagger_mode: true
  aa_epsilon: 0.2

comparison:
  model_types: [reg_tree]
  distill_n_samples: 10000
  eval_n_samples: 3000
  reg_tree:
    max_depth: 12

dagger:
  iterations: 10
  samples_per_iter: 10000

evaluation:
  seeds: [42, 123, 456, 789, 1011, 1314, 1617, 1920, 2223, 2526]
  n_eval_episodes: 5

output_dir: experiments/results/exp014_hopper_dagger
