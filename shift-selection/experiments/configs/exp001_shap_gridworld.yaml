name: exp001_shap_gridworld
description: "SpuriousGridWorld (p=0.0) で SHAP による自動シフト候補選択 + 前論文 Stage 2 評価のパイロット実験。MoET d=5 で Stage 1 を確実に達成し、SHAP が c を正しく上位に出すかを確認する。"

env:
  spurious_p: 0.0

oracle:
  n_steps: 50000

surrogate:
  n_experts: 4
  max_depth: 5
  distill_epochs: 100
  n_distill_samples: 10000

evaluation:
  seeds: [42, 123, 456, 789, 0]
  n_eval_samples: 2000
  n_eval_episodes: 100

shap:
  n_background: 100
  n_eval: 300
  n_samples: 100

n_workers: 4
output_dir: experiments/results/exp001_shap_gridworld
