name: exp002_gridworld_noise_p_sweep
description: >
  Spurious GridWorld 上で spurious_p とノイズ次元数を同時に sweep し、
  候補発見法の差がどの条件まで保たれるかを確認する実験。

env:
  p_values: [0.05, 0.15, 0.25]
  n_noise_values: [3, 7, 15]
  grid_size: 5
  max_steps: 50

oracle:
  n_steps: 50000

surrogate:
  n_experts: 4
  max_depth: 5
  distill_epochs: 100
  n_distill_samples: 10000

candidate_discovery:
  methods:
    - mutual_info
    - linear_probe_drop
    - tree_probe_drop
    - random
  top_k: 3

evaluation:
  seeds: [0, 42, 123, 456, 789]
  n_eval_samples: 2000
  n_eval_episodes: 200

n_workers: 4
runtime:
  estimated_minutes_per_task: 1.5

output_dir: experiments/results/exp002
